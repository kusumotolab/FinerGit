name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel a run that is superseded by a newer push to the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Keep the other platform running so that a platform-specific failure is visible on its own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The shell script gradlew is used on Linux; gradlew.bat is used on Windows so that the
      # job does not depend on how Git converted the line endings of the shell script.
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./gradlew test

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: ignore
